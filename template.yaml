AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Project Deployment is a service that manages the deployment of projects to the cloud.

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for the apps domain
  AppsDomainSuffix:
    Type: String
    Description: Domain suffix for deployed apps (each app gets <uuid>.<suffix>)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 100

Resources:
  CreateCloudProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/create-cloud-profile.handler
      Description: Creates cloud profile for given project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/create-cloud-profile.ts

  DeployModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/deploy-module.handler
      Description: Deploy a project module
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
        - S3CrudPolicy:
            BucketName: !Ref WebHostingBucket
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
          WEB_HOSTING_BUCKET: !Ref WebHostingBucket
          APPS_DOMAIN_SUFFIX: !Ref AppsDomainSuffix
          JIGJOY_API_ENDPOINT: "{{resolve:secretsmanager:vars:SecretString:JigJoyApiEndpoint}}"
          INTERNAL_SERVICE_TOKEN: "{{resolve:secretsmanager:vars:SecretString:InternalServiceToken}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/deploy-module.ts

  GetEntryPointFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-entry-point.handler
      Description: Get entry point details for projectId/environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-entry-point.ts

  ProjectCloudProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-ProjectCloudProfile"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-hosting"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebHostingBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebHostingBucket.Arn}/*"

  # ---- CloudFront Function: rewrite URI by subdomain ----
  RewriteUriBySubdomain:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-RewriteUriBySubdomain"
      AutoPublish: true
      FunctionConfig:
        Comment: Extracts project UUID from subdomain and prepends it to the URI path
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var headers = request.headers;
          if (headers.host && headers.host.value) {
            var host = headers.host.value;
            var projectId = host.split('.')[0];
            request.uri = '/' + projectId + request.uri;
          }
          return request;
        }

  # ---- CloudFront Distribution for deployed user apps ----
  AppsCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Sub "${WebHostingBucket}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteUriBySubdomain.FunctionARN
        Aliases:
          - !Sub "*.${AppsDomainSuffix}"
        ViewerCertificate:
          AcmCertificateArn: "{{resolve:ssm:/jigjoy/certs/apps-wildcard-us-east-1}}"
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Enabled: true
        HttpVersion: http2and3

  # ---- Route53 wildcard record for *.apps.dev.jigjoy.ai ----
  AppsWildcardDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "*.${AppsDomainSuffix}"
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront global hosted zone (AWS constant)
        DNSName: !GetAtt AppsCloudFrontDistribution.DomainName

Outputs:
  CreateCloudProfileFunctionArn:
    Value: !GetAtt CreateCloudProfileFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateCloudProfileFunctionArn"

  DeployModuleFunctionArn:
    Value: !GetAtt DeployModuleFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DeployModuleFunctionArn"

  GetEntryPointFunctionArn:
    Value: !GetAtt GetEntryPointFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetEntryPointFunctionArn"

  WebHostingBucketName:
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketName"

  WebHostingBucketWebsiteUrl:
    Value: !GetAtt WebHostingBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketWebsiteUrl"

  AppsCloudFrontDistributionId:
    Value: !Ref AppsCloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-AppsCloudFrontDistributionId"

  AppsCloudFrontDomainName:
    Value: !GetAtt AppsCloudFrontDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-AppsCloudFrontDomainName"

  AppsDomainSuffix:
    Value: !Ref AppsDomainSuffix
    Export:
      Name: !Sub "${AWS::StackName}-AppsDomainSuffix"

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  project-deployment

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:

  CreateCloudProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/create-cloud-profile.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Creates cloud profile for give project
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /project-cloud-profile
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/create-cloud-profile.ts

  DeployModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/deploy-module.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Deploy an project module
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /deploy-module
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/deploy-module.ts
  
  GetEntryPointFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-entry-point.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Get entry point details for projectId
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /projects/{projectId}/environments/{environment}/entry-point
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-entry-point.ts
  
  ProjectCloudProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProjectCloudProfile
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

Outputs:
  DeploymentServiceApi:
    Description: "API Gateway URL for the deployment service"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: DeploymentServiceApi 

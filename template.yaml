AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  project-deployment

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'content-type'"
      AllowOrigin: "'*'"

Resources:

  DeployModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/controllers/deploy.deployModuleHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Deploy an project module
      Environment:
        Variables:
          APPLICATION_TABLE: !Ref ApplicationTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /deploy
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/controllers/deploy.ts

  GetEntryPointFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: index.getDevEntryPointHandler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProjectCloudProfilesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectCloudProfilesTable
      Events:
        ApiGetDevEntryPoint:
          Type: Api
          Properties:
            Path: /projects/{projectId}/environments/dev/entry-point
            Method: get
            RestApiId: !Ref HttpApi
  
  GetEntryPointFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-entry-point.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Get entry point details for projectId
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /projects/{projectId}/environments/{environment}/entry-point
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-entry-point.ts
  
  ProjectCloudProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProjectCloudProfile
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

Outputs:
  DeploymentServiceApi:
    Description: "API Gateway URL for the deployment service"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: DeploymentServiceApi 

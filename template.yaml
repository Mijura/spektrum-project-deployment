AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Project Deployment is a service that manages the deployment of projects to the cloud.

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 100

Resources:
  CreateCloudProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/create-cloud-profile.handler
      Description: Creates cloud profile for given project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/create-cloud-profile.ts

  DeployModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/deploy-module.handler
      Description: Deploy a project module
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
        - S3CrudPolicy:
            BucketName: !Ref WebHostingBucket
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
          WEB_HOSTING_BUCKET: !Ref WebHostingBucket
          JIGJOY_API_ENDPOINT: "{{resolve:secretsmanager:vars:SecretString:JigJoyApiEndpoint}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/deploy-module.ts

  GetEntryPointFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-entry-point.handler
      Description: Get entry point details for projectId/environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectCloudProfileTable
      Environment:
        Variables:
          PROJECT_CLOUD_PROFILE: !Ref ProjectCloudProfileTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-entry-point.ts

  ProjectCloudProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-ProjectCloudProfile"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-hosting"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebHostingBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebHostingBucket.Arn}/*"

Outputs:
  CreateCloudProfileFunctionArn:
    Value: !GetAtt CreateCloudProfileFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateCloudProfileFunctionArn"

  DeployModuleFunctionArn:
    Value: !GetAtt DeployModuleFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DeployModuleFunctionArn"

  GetEntryPointFunctionArn:
    Value: !GetAtt GetEntryPointFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetEntryPointFunctionArn"

  WebHostingBucketName:
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketName"

  WebHostingBucketWebsiteUrl:
    Value: !GetAtt WebHostingBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-WebHostingBucketWebsiteUrl"
